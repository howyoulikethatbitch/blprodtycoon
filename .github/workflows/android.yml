name: Android APK (Capacitor) Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean previous builds
        run: |
          rm -rf node_modules
          rm -rf android/app/build android/build android/.gradle
          rm -rf dist

      - name: Install Node dependencies (npm)
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets (Vite → dist/)
        run: npm run build

      - name: Add Capacitor Android platform (idempotent)
        run: npx cap add android || echo "Android platform already exists"

      - name: Generate Android icons from icon.png
        run: npx @capacitor/assets generate --iconPath icon.png --android --outDir android/app/src/main/res || echo "Icon generation skipped"

      - name: Sync Capacitor (web → native)
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode=none

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::APK not produced — build failed"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BL-Production-Tycoon-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
